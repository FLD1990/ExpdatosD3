<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarana · Feliz Cumpleaños 🎂</title>
    <meta name="description" content="Una web especial para celebrar el cumpleaños de Jarana">
    <meta name="theme-color" content="#0a0420">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="grain"></div>
    </div>

    <div class="hero-bg" aria-hidden="true">
        <div class="hero-bg-img" id="hero-bg-img"></div>
        <div class="hero-bg-overlay"></div>
    </div>

    <main>
        <header class="hero">
            <div class="hero-content">
                <span class="badge">
                    <span class="badge-dot"></span>
                    Cumpleaños · 2026
                </span>

                <div class="hero-portrait" id="hero-portrait" aria-hidden="true">
                    <div class="hero-rays-wrap">
                        <div class="hero-rays"></div>
                        <div class="hero-rays-soft"></div>
                    </div>
                    <div class="hero-portrait-inner">
                        <div class="hero-portrait-stack" id="hero-portrait-stack"></div>
                        <svg class="hero-frame" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                            <defs>
                                <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#fff7d2"/>
                                    <stop offset="22%" stop-color="#f1cf6b"/>
                                    <stop offset="50%" stop-color="#c8932a"/>
                                    <stop offset="78%" stop-color="#8d6017"/>
                                    <stop offset="100%" stop-color="#3a2607"/>
                                </linearGradient>
                                <linearGradient id="ribbonFill" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#ffeaa3"/>
                                    <stop offset="55%" stop-color="#dfa84a"/>
                                    <stop offset="100%" stop-color="#8d6017"/>
                                </linearGradient>
                                <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#fff7d2" stop-opacity="0"/>
                                    <stop offset="50%" stop-color="#fff7d2" stop-opacity="0.55"/>
                                    <stop offset="100%" stop-color="#fff7d2" stop-opacity="0"/>
                                </linearGradient>
                                <path id="curveBottom" d="M 56,200 A 148,148 0 0 0 344,200"/>
                                <clipPath id="donutClip">
                                    <path d="M 18,200 A 182,182 0 1 0 382,200 A 182,182 0 1 0 18,200 Z M 90,200 A 110,110 0 1 1 310,200 A 110,110 0 1 1 90,200 Z" fill-rule="evenodd"/>
                                </clipPath>
                            </defs>

                            <!-- Solid gold donut frame -->
                            <path class="frame-donut"
                                d="M 18,200 A 182,182 0 1 0 382,200 A 182,182 0 1 0 18,200 Z M 90,200 A 110,110 0 1 1 310,200 A 110,110 0 1 1 90,200 Z"
                                fill="url(#goldFill)"
                                fill-rule="evenodd"/>

                            <!-- Edge contours -->
                            <circle cx="200" cy="200" r="182" fill="none" stroke="#1a0d04" stroke-width="1.2"/>
                            <circle cx="200" cy="200" r="110" fill="none" stroke="#1a0d04" stroke-width="2"/>

                            <!-- Engraved decorative rings inside the gold -->
                            <circle cx="200" cy="200" r="170" fill="none" stroke="#3d2710" stroke-width="0.7" opacity="0.65"/>
                            <circle cx="200" cy="200" r="121" fill="none" stroke="#3d2710" stroke-width="0.7" opacity="0.65"/>
                            <circle cx="200" cy="200" r="160" fill="none" stroke="#fff5c2" stroke-width="0.5" opacity="0.4"/>
                            <circle cx="200" cy="200" r="131" fill="none" stroke="#fff5c2" stroke-width="0.5" opacity="0.4"/>

                            <!-- Animated shimmer sweep over the gold band -->
                            <g clip-path="url(#donutClip)">
                                <rect class="frame-shimmer" x="-200" y="-50" width="160" height="500" fill="url(#shimmerGrad)" transform="skewX(-18)"/>
                            </g>

                            <!-- Curved bottom Latin tag -->
                            <text class="hero-curved-text"
                                font-family="'Instrument Serif', serif"
                                font-style="italic"
                                font-size="20"
                                fill="#2a1a07"
                                letter-spacing="6">
                                <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">ARS · GRATIA · FELIS</textPath>
                            </text>

                            <!-- Side ornaments -->
                            <g class="ornaments" fill="#2a1a07">
                                <text x="48" y="208" text-anchor="middle" font-size="22" font-family="serif">✦</text>
                                <text x="352" y="208" text-anchor="middle" font-size="22" font-family="serif">✦</text>
                            </g>

                            <!-- Top ribbon banner -->
                            <g class="hero-banner">
                                <!-- Notched side tails -->
                                <path d="M12,46 L72,52 L58,94 L0,102 L18,72 Z" fill="#3d2710"/>
                                <path d="M388,46 L328,52 L342,94 L400,102 L382,72 Z" fill="#3d2710"/>
                                <!-- Banner main -->
                                <path d="M65,50 Q200,14 335,50 L325,100 Q200,66 75,100 Z"
                                    fill="url(#ribbonFill)"
                                    stroke="#2a1a07"
                                    stroke-width="1.4"/>
                                <!-- Inner pinstripe -->
                                <path d="M80,76 Q200,55 320,76"
                                    fill="none"
                                    stroke="#2a1a07"
                                    stroke-width="0.5"
                                    opacity="0.45"/>
                                <!-- Title -->
                                <text x="200" y="83"
                                    text-anchor="middle"
                                    fill="#2a1a07"
                                    font-family="Inter, system-ui, sans-serif"
                                    font-weight="900"
                                    font-size="26"
                                    letter-spacing="7">JARANA</text>
                            </g>
                        </svg>
                    </div>
                </div>

                <h1 class="hero-title">
                    <span class="hero-name">Jarana</span>
                    <span class="hero-tag">feliz cumpleaños</span>
                </h1>

                <div class="hero-actions">
                    <a href="#galeria" class="btn btn-primary">
                        <span>Ver fotos</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </a>
                    <a href="#felicitaciones" class="btn btn-ghost">
                        <span>Dejar mensaje</span>
                    </a>
                </div>
            </div>

            <div class="hero-scroll" aria-hidden="true">
                <span></span>
            </div>
        </header>

        <section id="galeria" class="section reveal">
            <div id="gallery" class="gallery" aria-live="polite">
                <p class="gallery-status">Cargando momentos…</p>
            </div>
        </section>

        <section id="felicitaciones" class="section reveal">
            <div class="section-head">
                <span class="eyebrow">Mensajes</span>
                <h2>Deja tu felicitación</h2>
            </div>

            <div class="glass comments-card">
                <div id="cusdis_thread"
                    data-host="https://cusdis.com"
                    data-app-id="071730b3-7090-4e30-bfaf-052dd6d75545"
                    data-page-id="cumple-jarana"
                    data-page-url="https://fld1990.github.io/ExpdatosD3/"
                    data-page-title="Cumpleaños de Jarana"
                ></div>
                <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
            </div>
        </section>

        <footer class="footer">
            <p>Hecho con 💛 para Jarana</p>
        </footer>
    </main>

    <!-- Celebración tras comentar -->
    <div class="celebration" id="celebration" aria-hidden="true">
        <div class="celebration-confetti" id="celebration-confetti"></div>
        <div class="celebration-text">
            <span class="ct-line-1">A</span>
            <span class="ct-line-2">Jarana</span>
            <span class="ct-line-3">le gusta</span>
            <span class="ct-heart">💛</span>
        </div>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
