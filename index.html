<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarana · Feliz Cumpleaños 🎂</title>
    <meta name="description" content="Una web especial para celebrar el cumpleaños de Jarana">
    <meta name="theme-color" content="#0a0420">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="grain"></div>
    </div>

    <div class="hero-bg" aria-hidden="true">
        <div class="hero-bg-img" id="hero-bg-img"></div>
        <div class="hero-bg-overlay"></div>
    </div>

    <main>
        <header class="hero">
            <div class="hero-content">
                <span class="badge">
                    <span class="badge-dot"></span>
                    Cumpleaños · 2026
                </span>

                <div class="hero-portrait" id="hero-portrait" aria-hidden="true">
                    <div class="hero-portrait-ring"></div>
                    <div class="hero-portrait-img"></div>
                </div>

                <h1 class="hero-title">
                    <span class="hero-name">Jarana</span>
                    <span class="hero-tag">feliz cumpleaños</span>
                </h1>

                <p class="hero-sub">La reina peluda de los ojos azules cumple un año más.<br>Bienvenidos a su rincón.</p>

                <div class="hero-actions">
                    <a href="#galeria" class="btn btn-primary">
                        <span>Ver fotos</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </a>
                    <a href="#felicitaciones" class="btn btn-ghost">
                        <span>Dejar mensaje</span>
                    </a>
                </div>
            </div>

            <div class="hero-scroll" aria-hidden="true">
                <span></span>
            </div>
        </header>

        <section id="galeria" class="section reveal">
            <div id="gallery" class="gallery" aria-live="polite">
                <p class="gallery-status">Cargando momentos…</p>
            </div>
        </section>

        <section id="felicitaciones" class="section reveal">
            <div class="section-head">
                <span class="eyebrow">Mensajes</span>
                <h2>Deja tu felicitación</h2>
                <p>Sin registros, sin login. Solo amor 💌</p>
            </div>

            <div class="glass comments-card">
                <div id="cusdis_thread"
                    data-host="https://cusdis.com"
                    data-app-id="071730b3-7090-4e30-bfaf-052dd6d75545"
                    data-page-id="cumple-jarana"
                    data-page-url="https://fld1990.github.io/ExpdatosD3/"
                    data-page-title="Cumpleaños de Jarana"
                    data-theme="dark"
                ></div>
                <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
            </div>
        </section>

        <footer class="footer">
            <p>Hecho con 💛 para Jarana</p>
        </footer>
    </main>

    <!-- Celebración tras comentar -->
    <div class="celebration" id="celebration" aria-hidden="true">
        <div class="celebration-confetti" id="celebration-confetti"></div>
        <div class="celebration-text">
            <span class="ct-line-1">A</span>
            <span class="ct-line-2">Jarana</span>
            <span class="ct-line-3">le gusta</span>
            <span class="ct-heart">💛</span>
        </div>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
