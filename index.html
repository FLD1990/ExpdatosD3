<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarana · Feliz Cumpleaños 🎂</title>
    <meta name="description" content="Una web especial para celebrar el cumpleaños de Jarana">
    <meta name="theme-color" content="#0a0420">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="grain"></div>
    </div>

    <div class="hero-bg" aria-hidden="true">
        <div class="hero-bg-img" id="hero-bg-img"></div>
        <div class="hero-bg-overlay"></div>
    </div>

    <main>
        <header class="hero">
            <div class="hero-content">
                <span class="badge">
                    <span class="badge-dot"></span>
                    Cumpleaños · 2026
                </span>

                <div class="hero-portrait" id="hero-portrait" aria-hidden="true">
                    <div class="hero-rays-wrap">
                        <div class="hero-rays"></div>
                    </div>
                    <div class="hero-portrait-inner">
                        <div class="hero-portrait-stack" id="hero-portrait-stack"></div>
                        <svg class="hero-frame" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                            <defs>
                                <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#fff3c4"/>
                                    <stop offset="45%" stop-color="#d4a544"/>
                                    <stop offset="100%" stop-color="#7a4a14"/>
                                </linearGradient>
                                <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#ffe39a"/>
                                    <stop offset="100%" stop-color="#9a6d22"/>
                                </linearGradient>
                                <path id="curveBottom" d="M 55,200 A 145,145 0 0 0 345,200"/>
                            </defs>

                            <circle cx="200" cy="200" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
                            <circle cx="200" cy="200" r="125" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
                            <circle cx="200" cy="200" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.45"/>

                            <text class="hero-curved-text" font-family="'Instrument Serif', serif" font-style="italic" font-size="16" fill="url(#goldGrad)" letter-spacing="5">
                                <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">ARS · GRATIA · FELIS</textPath>
                            </text>

                            <g class="hero-banner">
                                <path d="M30,55 L72,58 L62,85 L20,92 Z" fill="#7a4a14"/>
                                <path d="M370,55 L328,58 L338,85 L380,92 Z" fill="#7a4a14"/>
                                <path d="M62,55 Q200,25 338,55 L328,95 Q200,70 72,95 Z" fill="url(#ribbonGrad)" stroke="#7a4a14" stroke-width="1.2"/>
                                <path d="M72,76 Q200,52 328,76" fill="none" stroke="#7a4a14" stroke-width="0.5" opacity="0.5"/>
                                <text x="200" y="84" text-anchor="middle" fill="#3d2710" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="4">JARANA</text>
                            </g>
                        </svg>
                    </div>
                </div>

                <h1 class="hero-title">
                    <span class="hero-name">Jarana</span>
                    <span class="hero-tag">feliz cumpleaños</span>
                </h1>

                <div class="hero-actions">
                    <a href="#galeria" class="btn btn-primary">
                        <span>Ver fotos</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </a>
                    <a href="#felicitaciones" class="btn btn-ghost">
                        <span>Dejar mensaje</span>
                    </a>
                </div>
            </div>

            <div class="hero-scroll" aria-hidden="true">
                <span></span>
            </div>
        </header>

        <section id="galeria" class="section reveal">
            <div id="gallery" class="gallery" aria-live="polite">
                <p class="gallery-status">Cargando momentos…</p>
            </div>
        </section>

        <section id="felicitaciones" class="section reveal">
            <div class="section-head">
                <span class="eyebrow">Mensajes</span>
                <h2>Deja tu felicitación</h2>
                <p>Sin registros, sin login. Solo amor 💌</p>
            </div>

            <div class="glass comments-card">
                <div id="cusdis_thread"
                    data-host="https://cusdis.com"
                    data-app-id="071730b3-7090-4e30-bfaf-052dd6d75545"
                    data-page-id="cumple-jarana"
                    data-page-url="https://fld1990.github.io/ExpdatosD3/"
                    data-page-title="Cumpleaños de Jarana"
                    data-theme="dark"
                ></div>
                <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
            </div>
        </section>

        <footer class="footer">
            <p>Hecho con 💛 para Jarana</p>
        </footer>
    </main>

    <!-- Celebración tras comentar -->
    <div class="celebration" id="celebration" aria-hidden="true">
        <div class="celebration-confetti" id="celebration-confetti"></div>
        <div class="celebration-text">
            <span class="ct-line-1">A</span>
            <span class="ct-line-2">Jarana</span>
            <span class="ct-line-3">le gusta</span>
            <span class="ct-heart">💛</span>
        </div>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
